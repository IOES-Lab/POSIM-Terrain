[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posim-terrain"
version = "0.1.0"
description = "Geographic land and ocean terrain artifacts"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyproj>=3.5", "Pillow>=10", "rasterio>=1.3", "httpx>=0.24", "netCDF4>=1.6", "numcodecs>=0.12", "shapely>=2", "pyogrio>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
posim_terrain = ["data/*"]
